<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Pessoa - Controle de Presença</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Cadastrar Novo Aluno / Funcionário</h2>
        
        <form action="/cadastrar" method="POST">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required placeholder="Ex: João Silva">
            </div>

            <div class="form-group">
                <label for="matricula">Matrícula / CPF:</label>
                <input type="text" id="matricula" name="matricula" required placeholder="Ex: 2026001">
            </div>

            <div class="form-group">
                <label for="turma_setor">Instrutor:</label>
                <input type="text" id="turma_setor" name="turma_setor" placeholder="Ex: João Silva / RH">
            </div>

            <div class="form-group">
                <label for="tipo">Tipo:</label>
                <select id="tipo" name="tipo" required>
                    <option value="Aluno">Aluno</option>
                    <option value="Funcionario">Funcionário</option>
                </select>
            </div>

            <button type="submit" class="btn-salvar">Salvar Cadastro</button>
        </form>

        <br>
        <a href="/">← Voltar para a Página Inicial</a>
    </div>
</body>
</html>
